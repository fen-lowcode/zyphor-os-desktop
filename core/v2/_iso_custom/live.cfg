label live-amd64
	menu label ^Start Zyphor OS (amd64)
	menu default
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components quiet splash username=user hostname=zyphor-os

label live-amd64-failsafe
	menu label Start Zyphor OS (amd64 fail-safe mode)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788 username=user hostname=zyphor-os
