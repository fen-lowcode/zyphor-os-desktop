[greeter]
background = /usr/share/desktop-base/zyphor-os-theme/login/background.svg
theme-name = WhiteSur-Dark
font-name = Cantarell 11
icon-theme-name = zyphor-os-3-icons
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb
indicators = ~host;~spacer;~session;~layout;~a11y;~clock;~power;
clock-format = %d %b, %H:%M
screensaver-timeout = 60
default-user-image = /etc/skel/.face.icon
keyboard = onboard
