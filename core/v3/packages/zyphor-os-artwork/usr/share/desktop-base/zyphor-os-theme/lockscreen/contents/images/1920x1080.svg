<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Radial Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Base -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- High-Tech Circuit & Hex Tile Seamless Pattern -->
    <pattern id="tech-pattern" width="320" height="320" patternUnits="userSpaceOnUse">
      <!-- Hexagonal Nodes -->
      <polygon points="160,20 190,37 190,73 160,90 130,73 130,37" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" />
      <polygon points="0,180 30,197 30,233 0,250 -30,233 -30,197" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" />
      <polygon points="320,180 350,197 350,233 320,250 290,233 290,197" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" />

      <!-- Circuit Traces -->
      <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
        <!-- Trace 1 -->
        <path d="M 160,90 L 160,140 L 210,190 L 260,190" />
        <circle cx="260" cy="190" r="3" fill="#06b6d4" />
        
        <!-- Trace 2 -->
        <path d="M 130,55 L 70,55 L 40,85 L 40,140" />
        <circle cx="40" cy="140" r="3" fill="#06b6d4" />

        <!-- Trace 3 -->
        <path d="M 190,55 L 250,55 L 280,85 L 280,130" />
        <circle cx="280" cy="130" r="3" fill="#06b6d4" fill-opacity="0.5" />

        <!-- Trace 4 -->
        <path d="M 160,230 L 160,280 L 110,280 L 90,300" />
        <circle cx="90" cy="300" r="3" fill="#38bdf8" />

        <!-- Cross Diagonal Traces -->
        <path d="M 0,40 L 50,40 L 90,80" />
        <path d="M 320,40 L 270,40 L 230,80" />
        <path d="M 100,200 L 140,200 L 160,220" />
      </g>

      <!-- Micro Chips / Processor Nodes -->
      <rect x="145" y="42" width="30" height="36" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
      <line x1="140" y1="50" x2="145" y2="50" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="140" y1="60" x2="145" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="140" y1="70" x2="145" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="175" y1="50" x2="180" y2="50" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="175" y1="60" x2="180" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="175" y1="70" x2="180" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

      <!-- Glowing Data Points -->
      <circle cx="160" cy="140" r="2" fill="#a855f7" />
      <circle cx="210" cy="190" r="2" fill="#38bdf8" />
      <circle cx="70" cy="55" r="2" fill="#38bdf8" />
    </pattern>

    <!-- Soft Blur for Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="deep-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="200" r="350" fill="#0284c7" opacity="0.15" filter="url(#deep-glow)" />
  <circle cx="1600" cy="880" r="400" fill="#6366f1" opacity="0.12" filter="url(#deep-glow)" />
  <circle cx="960" cy="540" r="300" fill="#a855f7" opacity="0.08" filter="url(#deep-glow)" />

  <!-- Base Tech Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Repeated Tech Circuit Pattern Layer -->
  <rect width="100%" height="100%" fill="url(#tech-pattern)" />

  <!-- Dynamic Perspective / Ambient Streaming Data Lines -->
  <g filter="url(#glow)">
    <!-- Horizontal Data Beams -->
    <path d="M -100 240 L 600 240 L 700 340 L 2000 340" fill="none" stroke="url(#line-grad-1)" stroke-width="2" opacity="0.6" />
    <path d="M -100 720 L 1100 720 L 1220 600 L 2000 600" fill="none" stroke="url(#line-grad-1)" stroke-width="1.5" opacity="0.5" />
    <path d="M -100 480 L 400 480 L 520 600 L 2000 600" fill="none" stroke="url(#line-grad-1)" stroke-width="1" opacity="0.3" />

    <!-- Bright Focal Nodes -->
    <circle cx="600" cy="240" r="4" fill="#38bdf8" />
    <circle cx="700" cy="340" r="3" fill="#818cf8" />
    <circle cx="1100" cy="720" r="4" fill="#c084fc" />
    <circle cx="1220" cy="600" r="3" fill="#38bdf8" />
  </g>

  <!-- Central Digital Perspective Ring HUD Accent -->
  <g transform="translate(960, 540)" opacity="0.3">
    <!-- Outer Tech Circle -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8 12 8" />
    <circle cx="0" cy="0" r="300" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="120 20 40 20" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-dasharray="6 6" />
    
    <!-- Crosshairs -->
    <line x1="-320" y1="0" x2="-260" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="260" y1="0" x2="320" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="-320" x2="0" y2="-260" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="260" x2="0" y2="320" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Foreground Vignette / Framing -->
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.5" />
</svg>
