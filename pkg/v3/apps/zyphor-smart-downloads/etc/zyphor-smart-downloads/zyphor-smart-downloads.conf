# zyphor-smart-downloads configuration
# Edit this file (as root) or use:  sudo zyphor-smart-downloads set KEY VALUE
# Durations accept: 30s (seconds), 5m (minutes), 1h (hours). A bare number = seconds.

# yes/no - master switch
ENABLED=yes

# How often the Downloads folders are scanned.
#   Below 1m  : cron still fires every minute; the runner scans repeatedly
#               inside that minute (e.g. 15s = 4 scans/minute). Minimum: 5s.
#   1m or more: the runner skips cron ticks until the interval has elapsed
#               (e.g. 10m = one scan every 10 minutes).
SCAN_INTERVAL=1m

# A file must not have been modified for at least this long to be touched.
MIN_FILE_AGE=10s

# Size is sampled twice this far apart; a file that grew is still downloading.
STABILITY_WAIT=2s

# Where the <date> in the new filename comes from:
#   birth = when the file appeared on disk (falls back to mtime), mtime, now
DATE_SOURCE=birth

# strftime format of the filename prefix -> 20261022-143005-photo.jpg
DATE_FORMAT=%Y%m%d-%H%M%S

# Space separated user names. Empty INCLUDE_USERS = every normal user (UID >= 1000).
INCLUDE_USERS=""
EXCLUDE_USERS=""

# What to do with files whose type is not recognised: leave | misc
# misc moves them to ~/Downloads/Other (still renamed with the date prefix).
UNKNOWN_FILES=leave

# What to do with damaged/truncated files: quarantine | leave
# quarantine moves them to ~/Downloads/Damaged so they never reach your real folders.
DAMAGED_ACTION=quarantine
